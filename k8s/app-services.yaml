# ============================================================
# STREAMING SERVICE
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming
spec:
  replicas: 3

  selector:
    matchLabels:
      app: streaming

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: streaming

    spec:
      containers:
        - name: streaming
          image: streamingapp-streaming:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3002

          envFrom:
            - configMapRef:
                name: streamingapp-config
            - secretRef:
                name: streamingapp-secret

          readinessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: streaming
spec:
  selector:
    app: streaming

  ports:
    - port: 3002
      targetPort: 3002

  type: ClusterIP


